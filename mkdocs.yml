site_name: Banco de Dados
site_description: Anotações, exemplos e materiais de estudo sobre bancos de dados, visualização de dados e aprendizado de máquina.
site_author: Maria Gabriela Santos
site_url: https://mgabriel4.github.io/banco-de-dados/
repo_url: https://github.com/mgabriel4/banco-de-dados
repo_name: mgabriel4/banco-de-dados
edit_uri: edit/main/docs/
copyright: Copyright &copy; Maria Gabriela Santos

theme:
  name: material
  language: pt-BR
  logo: assets/images/server.png
  favicon: assets/images/server.png
  palette:
    - scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro

  font:
    text: Roboto
    code: Fira Code

  features:
    - navigation.tabs
    - tags
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.top
    - navigation.path
    - navigation.tracking
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - md_in_html
  - markdown_grid_tables:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.blocks.caption
  - pymdownx.snippets:
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - footnotes
  - neoteroi.timeline
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true


plugins:
  - search
  - awesome-pages
  - table-reader
  - mkdocs-jupyter
  - glightbox
  - include-markdown
  - git-revision-date-localized:
      enable_creation_date: true
  - git-authors
  - minify:
      minify_html: true
  - badges
  - markdown-exec
  - mkdocs-pdf
  - render_swagger:
      allow_arbitrary_locations : true
  - termynal:
      prompt_literal_start:
        - "$"
        - ">"

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/neoteroi-mkdocs.min.css
  - assets/stylesheets/neoteroi-timeline.css
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mgabriel4
      name: Maria Gabriela Santos no GitHub

not_in_nav: |
  classes/**/*.py
  classes/preprocessing/ok.md

nav:
  - Início: index.md
  - Banco de dados:
    - Conceitos: classes/dados/conceitos.md
    - Abordagens e modelos: classes/dados/modelos.md
  - SQL:
    - Introdução: classes/sql/introducao.md
    - Consultas: classes/sql/consultas.md
    - Junções (JOIN): classes/sql/juncoes.md
    - Subconsultas: classes/sql/subqueries.md
    - Normalização: classes/sql/normalizacao.md
  - NoSQL:
    - Introdução: classes/nosql/introducao.md
    - MongoDB: classes/nosql/mongodb.md
    - Cassandra: classes/nosql/cassandra.md
  - Visualização de dados:
    - Gráficos: classes/visualizacao/graficos.md
